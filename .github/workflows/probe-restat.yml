name: Probe restat

on:
  push:
    branches: [lead/ci-restat-probe]

permissions:
  contents: read

concurrency:
  group: probe-restat
  cancel-in-progress: true

jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: cold
        shell: bash
        run: bash probe.sh cold
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-restat-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
  restored:
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        case: [same, family, shared]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-restat-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: ${{ matrix.case }}
        shell: bash
        run: bash probe.sh ${{ matrix.case }}
