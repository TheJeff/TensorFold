name: Probe test-host

on:
  push:
    branches: [lead/ci-host-probe]

permissions:
  contents: read

concurrency:
  group: probe-host
  cancel-in-progress: true

jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: cold
        run: bash probe.sh cold
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-host-${{ github.run_id }}-${{ github.run_attempt }}
      - name: audit
        run: bash probe.sh audit
  restored:
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        case: [same, family, shared]
        gate: [test, test-host]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-host-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: ${{ matrix.case }} ${{ matrix.gate }}
        run: bash probe.sh ${{ matrix.case }} ${{ matrix.gate }}
